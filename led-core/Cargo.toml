[package]
name = "led-core"
version = "0.1.0"
edition = "2021"
description = "Pure, hardware-independent logic for the ESP32-C5 RGB LED project (host-testable)"

# Only serde + serde_json: no hardware dependencies, so this crate compiles and
# its tests run on the host (x86_64) as well as on the RISC-V firmware target.
[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# ── Strict checking mode ─────────────────────────────────────────
# Any rustc/clippy warning is a hard error (enforced by cargo build/test/clippy).
[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
