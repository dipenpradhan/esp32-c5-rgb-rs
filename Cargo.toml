[package]
name = "esp-c5-hello"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-hal = { version = "1.1", features = ["esp32c5", "unstable"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32c5"] }
esp-alloc = { version = "0.10", features = ["esp32c5"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[profile.dev]
debug = true
incremental = false

[profile.release]
debug = true
incremental = false
lto = false
codegen-units = 1
strip = "symbols"
